hw3_slam_node:
  ros__parameters:
    base_frame: base_link
    max_hamming: 1
    min_decision_margin: 20.0
    tf_timeout_s: 0.05
    max_pending_age_s: 1.5
    gate_chi2: 9.21034037197618

    # Calibrated from 4,487 stationary arena observations over multiple ranges
    # and view angles. Offline replay accepted every sample; max NIS was 3.858.
    measurement_sigma_base_m: 0.010
    measurement_sigma_per_meter: 0.005

    # Preliminary motion values. Replace after carpet motion trials.
    process_sigma_distance_base_m: 0.015
    process_sigma_distance_per_meter: 0.15
    process_sigma_yaw_base_rad: 0.04
    process_sigma_yaw_per_rad: 0.25

    # Small values fix the arbitrary local SLAM frame at the start pose.
    initial_pose_sigma_xy_m: 0.0001
    initial_pose_sigma_yaw_rad: 0.0001
    log_root: ~/hw3_logs
    run_name: ""

hw3_controller:
  ros__parameters:
    shape: square
    side_length_m: 1.8
    laps: 1
    step_distance_m: 0.05
    drive_speed_mps: 0.04
    # Six landmark-estimated trials: 0.06830 m mean per nominal 0.05 m command.
    translation_distance_scale: 1.3659095391112453

    # Preserve the safe small HW2 pulse, but predict measured direction-specific
    # mean rotation. A fresh landmark update is mandatory after every pulse.
    turn_command: 0.002
    turn_pulse_s: 0.10
    left_turn_increment_rad: 0.02020035352985965
    right_turn_increment_rad: 0.02261615748165217
    turn_tolerance_rad: 0.03490658503988659

    waypoint_tolerance_m: 0.07
    observation_timeout_s: 8.0
    max_blind_turn_pulses: 0
    start_delay_s: 3.0
    minimum_landmarks_to_start: 2
    log_root: ~/hw3_logs
    run_name: ""
