hw3_slam_node:
  ros__parameters:
    base_frame: base_link
    max_hamming: 1
    min_decision_margin: 20.0
    tf_timeout_s: 0.05
    max_pending_age_s: 1.5
    gate_chi2: 9.21034037197618

    # Preliminary values. Replace with arena calibration measurements.
    measurement_sigma_base_m: 0.025
    measurement_sigma_per_meter: 0.015
    process_sigma_distance_base_m: 0.015
    process_sigma_distance_per_meter: 0.15
    process_sigma_yaw_base_rad: 0.04
    process_sigma_yaw_per_rad: 0.25

    # Small values fix the arbitrary local SLAM frame at the start pose.
    initial_pose_sigma_xy_m: 0.0001
    initial_pose_sigma_yaw_rad: 0.0001
    log_root: ~/hw3_logs
    run_name: ""

hw3_controller:
  ros__parameters:
    shape: square
    side_length_m: 1.8
    laps: 1
    step_distance_m: 0.05
    drive_speed_mps: 0.04

    # Values retained from the successful HW2 stop-and-turn strategy.
    turn_command: 0.002
    turn_pulse_s: 0.10
    turn_increment_rad: 0.05235987755982989
    turn_tolerance_rad: 0.061086523819801536

    waypoint_tolerance_m: 0.07
    observation_timeout_s: 6.0
    max_blind_turn_pulses: 30
    start_delay_s: 3.0
    log_root: ~/hw3_logs
    run_name: ""
